    function reviewEntryHtml(item) {
      const dup = !!item.possible_duplicate;
      const kind = KIND_NAMES[item.entity_type] || 'Запись';
      const ts = parseTs(item.created_at);
      const title = item.title || item.raw_text || '';
      const canMerge = dup && ['notes', 'tasks'].includes(item.entity_type) && item.duplicate_of;
      const key = item.entity_type + ':' + item.id;
      let why;
      if (dup) {
        const ot = item.original_record && parseTs(item.original_record.created_at);
        why = 'похоже на повтор' + (ot ? ' записи в ' + timeOf(ot) : '');
      } else {
        why = 'не уверен, что понял верно';
      }
      return '<div class="review-entry" data-key="' + esc(key) + '">' +
        '<span class="kind k-warn">' + icon('alert') + '</span>' +
        '<div class="row-main">' +
          '<div class="head"><span class="row-title">' + esc(title || kind) + '</span>' +
            (item.amount ? '<span class="row-amount">' + esc(money(item.amount, item.currency || 'VND')) + '</span>' : '') + '</div>' +
          '<span class="note">' + esc((ts ? timeOf(ts) + ', ' : '') + kind.toLowerCase() + ', ' + why) + '</span>' +
          (item.content ? '<span class="row-sub">' + esc(item.content) + '</span>' : '') +
          (item.raw_transcript ? '<span class="row-meta">«' + esc(item.raw_transcript) + '»</span>' : '') +
          '<div class="review-actions">' +
            (canMerge ? '<button type="button" class="btn small primary" data-action="review-merge" data-key="' + esc(key) + '">Объединить</button>' : '') +
            '<button type="button" class="btn small ' + (canMerge ? '' : 'primary') + '" data-action="review-confirm" data-key="' + esc(key) + '">' + (dup ? 'Оставить обе' : 'Подтвердить') + '</button>' +
            (dup ? '' : '<button type="button" class="btn small" data-action="review-edit" data-key="' + esc(key) + '">Исправить</button>') +
            '<button type="button" class="btn small danger-quiet" data-action="review-reject" data-key="' + esc(key) + '">' + (dup ? 'Удалить повтор' : 'Удалить') + '</button>' +
          '</div>' +
        '</div></div>';
    }

    function renderReviewSheet() {
      const body = $('sheet').querySelector('.sheet-body');
      if (!body) return;
      const list = S.view === 'day' ? S.review.filter(i => !dayReviewItems(dayKey()).includes(i)) : S.review;
      body.innerHTML = list.length
        ? '<ul class="cards">' + list.map(i => '<li class="card-item review">' + reviewEntryHtml(i) + '</li>').join('') + '</ul>'
        : stateHtml('Всё проверено', 'Когда TRACE не уверен в записи или видит повтор, она появится здесь.');
    }

    function openReview() {
      openSheet({ title: 'Проверка записей', kind: 'review', body: '', noFooter: true });
      renderReviewSheet();
    }

    function findReview(key) {
      const [type, id] = key.split(':');
      return S.review.find(i => i.entity_type === type && String(i.id) === id);
    }

    async function reviewAct(action, key, btn) {
      const item = findReview(key);
      if (!item) return;
      if (action === 'reject' && !btn.dataset.armed) {
        // Inline named confirmation instead of a second dialog
        const actions = btn.closest('.review-actions');
        const name = item.title || item.raw_text || KIND_NAMES[item.entity_type];
        const noun = { finances: 'расход', tasks: 'задачу', notes: 'заметку' }[item.entity_type] || 'запись';
        actions.innerHTML = '<p class="confirm-text">Удалить ' + noun + ' «' + esc(name) + '»?</p>' +
          '<button type="button" class="btn small" data-action="review-cancel">Отмена</button>' +
          '<button type="button" class="btn small danger" data-action="review-reject" data-key="' + esc(key) + '" data-armed="1">Удалить запись</button>';
        actions.querySelector('[data-action="review-cancel"]').focus();
        return;
      }
      btn.setAttribute('aria-busy', 'true');
      const body = { table: item.entity_type, id: item.id };
      if (action === 'merge') body.target_id = item.duplicate_of;
      try {
        await api('/api/review/' + action, { method: 'POST', body });
        haptic(action === 'reject' ? 'warning' : 'success');
        toast(action === 'merge' ? 'Записи объединены' : action === 'reject' ? 'Запись удалена' : 'Запись сохранена');
        S.review = S.review.filter(i => i !== item);
        renderReviewBanner();
        if ($('sheet').open && $('sheet').dataset.kind === 'review') renderReviewSheet();
        loadView();
      } catch (e) {
        btn.removeAttribute('aria-busy');
        if (!(e instanceof AuthError)) failToast('выполнить действие', () => reviewAct(action, key, btn));
      }
    }

    // ================= Sheet (single dialog, never stacked) =================
    let sheetCfg = null;
    let sheetTrigger = null;

    function openSheet(cfg) {
      const dlg = $('sheet');
      sheetCfg = cfg;
      if (!dlg.open) sheetTrigger = document.activeElement;
      dlg.dataset.kind = cfg.kind || (cfg.entity && cfg.entity.kind) || '';
      dlg.innerHTML =
        '<form method="dialog" id="sheetForm" novalidate style="display:contents">' +
          '<div class="sheet-head"><h2 id="sheetTitle">' + esc(cfg.title) + '</h2>' +
            '<button type="button" class="icon-btn" data-action="close-sheet" title="Закрыть" aria-label="Закрыть">' + icon('close') + '</button></div>' +
          '<div class="sheet-body">' + cfg.body + '</div>' +
          (cfg.noFooter ? '' :
            '<div class="sheet-foot" id="sheetFoot">' +
              (cfg.canDelete ? '<button type="button" class="btn danger-quiet" data-action="ask-delete">Удалить</button>' : '') +
              '<span class="spacer"></span>' +
              '<button type="submit" class="btn primary" id="sheetSave">' + esc(cfg.primary) + '</button>' +
            '</div>') +
        '</form>';
      dlg.classList.remove('closing');
      if (!dlg.open) dlg.showModal();
      const first = dlg.querySelector('.sheet-body input:not([readonly]):not([type=radio]), .sheet-body textarea');
      if (first && cfg.entity && !cfg.entity.id) setTimeout(() => first.focus(), 50);
      else dlg.querySelector('[data-action="close-sheet"]').focus();
      if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
      wireValidation(dlg);
    }

    function closeSheet() {
      const dlg = $('sheet');
      if (!dlg.open) return;
      const done = () => {
        dlg.classList.remove('closing');
        if (dlg.open) dlg.close();
        dlg.innerHTML = '';
        sheetCfg = null;
        if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
        restoreFocus(sheetTrigger);
        sheetTrigger = null;
      };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
      dlg.classList.add('closing');
      setTimeout(done, 150);
    }

    // Lists re-render while a sheet is open, so the trigger may be gone: find its replacement
    function restoreFocus(el) {
      if (!el) return;
      if (document.contains(el)) { el.focus(); return; }
      const d = el.dataset || {};
      let sel = d.action ? '[data-action="' + d.action + '"]' : '';
      if (sel && d.kind) sel += '[data-kind="' + d.kind + '"]';
      if (sel && d.id) sel += '[data-id="' + d.id + '"]';
      if (sel && d.value) sel += '[data-value="' + d.value + '"]';
      const twin = sel && document.querySelector('main:not([hidden]) ' + sel);
      if (twin) twin.focus();
    }

    function askDelete() {
      const e = sheetCfg.entity;
      const foot = $('sheetFoot');
      foot.classList.add('confirming');
      foot.innerHTML = '<p class="confirm-text">Удалить ' + esc(e.noun) + ' «' + esc(e.name) + '»? Это нельзя отменить.</p>' +
        '<span class="spacer"></span>' +
        '<button type="button" class="btn" data-action="cancel-delete">Отмена</button>' +
        '<button type="button" class="btn danger" data-action="confirm-delete">Удалить ' + esc(e.noun) + '</button>';
      foot.querySelector('[data-action="cancel-delete"]').focus();
      haptic('warning');
    }

    function cancelDelete() {
      const foot = $('sheetFoot');
      foot.classList.remove('confirming');
      foot.innerHTML = '<button type="button" class="btn danger-quiet" data-action="ask-delete">Удалить</button><span class="spacer"></span>' +
        '<button type="submit" class="btn primary" id="sheetSave">' + esc(sheetCfg.primary) + '</button>';
      foot.querySelector('[data-action="ask-delete"]').focus();
    }

    async function confirmDelete(btn) {
      btn.setAttribute('aria-busy', 'true');
      try {
        await sheetCfg.onDelete();
        haptic('warning');
        closeSheet();
      } catch (e) {
        btn.removeAttribute('aria-busy');
        if (!(e instanceof AuthError)) failToast('удалить', () => confirmDelete(btn));
      }
    }

    // Blur-first validation: errors appear after leaving a field, clear on focus/typing
    function validateField(input) {
      const rule = input.dataset.validate;
      if (!rule) return true;
      const v = input.value.trim();
      let ok = true;
      if (rule === 'required') ok = v.length > 0;
      if (rule === 'amount') { const n = parseFloat(v.replace(/\s/g, '').replace(',', '.')); ok = Number.isFinite(n) && n > 0; }
      const err = $(input.id + '-error');
      if (err) err.hidden = ok;
      if (ok) input.removeAttribute('aria-invalid');
      else { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', input.id + '-error'); }
      return ok;
    }
    function clearFieldError(input) {
      input.removeAttribute('aria-invalid');
      const err = $(input.id + '-error');
      if (err) err.hidden = true;
    }
    function wireValidation(root) {
      root.querySelectorAll('[data-validate]').forEach(inp => {
        inp.addEventListener('blur', () => validateField(inp));
        inp.addEventListener('focus', () => clearFieldError(inp));
        inp.addEventListener('input', () => clearFieldError(inp));
      });
    }

    async function submitSheet(form) {
      const fields = [...form.querySelectorAll('[data-validate]')].filter(f => !f.closest('[hidden]'));
      const bad = fields.filter(f => !validateField(f));
      if (bad.length) {
        bad[0].focus();
        validateField(bad[0]);
        bad[0].scrollIntoView({ block: 'center' });
        haptic('error');
        return;
      }
      const btn = $('sheetSave');
      btn.setAttribute('aria-busy', 'true');
      try {
        await sheetCfg.onSave(form.elements);
        haptic('success');
        closeSheet();
      } catch (e) {
        btn.removeAttribute('aria-busy');
        if (!(e instanceof AuthError)) {
          haptic('error');
          // 409 carries a reason the user can act on (e.g. the word is already in the dictionary)
          toast(e.detail && e.detail.status === 409 && e.detail.error ? e.detail.error + '.' : 'Не удалось сохранить, данные остались в форме. Проверьте соединение и нажмите ещё раз.');
        }
      }
    }

    // ================= Capture (text + voice) =================
    const captureInput = $('captureInput');
    let recorder = null, recChunks = [], recTimer = null, recStart = 0;
    const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

    function syncCaptureButtons() {
      const hasText = captureInput.value.trim().length > 0;
      const recording = !!recorder;
      $('sendBtn').hidden = !(hasText || !canRecord) || recording;
      $('micBtn').hidden = !canRecord || (hasText && !recording);
    }
    function autoGrow() {
      captureInput.style.height = '48px';
      captureInput.style.height = Math.min(captureInput.scrollHeight, 120) + 'px';
      captureInput.classList.toggle('scroll', captureInput.scrollHeight > 120);
    }

    async function sendCapture(payload, label) {
      const btn = recorder ? $('micBtn') : $('sendBtn');
      btn.setAttribute('aria-busy', 'true');
      toast(label);
      // Captured while a past day is open: expenses go to that day and the screen stays on it
      const day = captureDay();
      if (day) payload = Object.assign({}, payload, { date: day });
      try {
        const res = await api('/api/capture', { method: 'POST', body: payload });
        haptic('success');
        toast(res.screen_notification || 'Записано');
        if (!day) S.date = null;
        return true;
      } catch (e) {
        if (!(e instanceof AuthError)) {
          haptic('error');
          toast('Запись не сохранилась. Текст остался в поле, попробуйте ещё раз.', e.detail ? { label: 'Скопировать детали', run: () => copyText(JSON.stringify(e.detail)) } : null);
        }
        return false;
      } finally {
        btn.removeAttribute('aria-busy');
        refresh();
      }
    }

    async function submitCapture() {
      const text = captureInput.value.trim();
      if (!text) { captureInput.focus(); return; }
      const ok = await sendCapture({ text }, 'Разбираю запись…');
      if (ok) { captureInput.value = ''; autoGrow(); syncCaptureButtons(); }
    }

    async function toggleRecording() {
      if (recorder) { recorder.stop(); return; }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        toast('Нет доступа к микрофону. Разрешите его в настройках или напишите текстом.');
        return;
      }
      const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      recChunks = [];
      recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(recTimer);
        const mime = (recorder.mimeType || type || 'audio/webm').split(';')[0];
        const blob = new Blob(recChunks, { type: mime });
        setRecordingUi(false);
        if (blob.size < 1500) { recorder = null; syncCaptureButtons(); toast('Запись слишком короткая. Говорите чуть дольше.'); return; }
        const b64 = await blobToBase64(blob);
        await sendCapture({ audio: b64, mime_type: mime }, 'Распознаю голос…');
        recorder = null;
        syncCaptureButtons();
      };
      recorder.start();
      haptic('medium');
      setRecordingUi(true);
    }
    function setRecordingUi(on) {
      const mic = $('micBtn');
      mic.classList.toggle('rec', on);
      mic.innerHTML = icon(on ? 'stop' : 'mic');
      mic.setAttribute('aria-label', on ? 'Остановить и отправить' : 'Записать голосом');
      mic.title = mic.getAttribute('aria-label');
      captureInput.hidden = on;
      $('recTime').hidden = !on;
      $('sendBtn').hidden = true;
      if (on) {
        recStart = Date.now();
        $('recTime').textContent = '0:00';
        recTimer = setInterval(() => {
          const s = Math.floor((Date.now() - recStart) / 1000);
          $('recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }, 500);
      }
    }
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).replace(/^data:[^;]+;base64,/, ''));
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
      catch (e) { toast('Не удалось скопировать. Выделите текст вручную.'); }
    }

    // ================= Access: dim the "create" buttons when there is no subscription =================
    const CREATE_ACTIONS = new Set(['new-task', 'new-note', 'new-word', 'new-rec', 'mic']);
    const accessLocked = () => document.body.classList.contains('no-access');
    function noAccessToast() {
      haptic('error');
      toast('Добавлять записи можно после оформления подписки.', { label: 'Подписка', run: settingsSheet });
    }
    function setAccess(sub) {
      const locked = !!sub && (sub.state === 'new' || sub.state === 'expired');
      document.body.classList.toggle('no-access', locked);
      document.querySelectorAll('[data-action="new-task"], [data-action="new-note"], [data-action="new-word"], [data-action="mic"], #sendBtn')
        .forEach(el => locked ? el.setAttribute('aria-disabled', 'true') : el.removeAttribute('aria-disabled'));
    }
    async function loadAccess() {
      try { setAccess(await api('/api/subscription')); } catch (e) {}
    }

    // ================= Events =================
    const OPENERS = { finance: financeSheet, task: taskSheet, note: noteSheet, word: wordSheet };

    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-action]');
      if (!el) return;
      const a = el.dataset.action;
      const id = el.dataset.id ? Number(el.dataset.id) : null;
      const v = el.dataset.value;
      if (CREATE_ACTIONS.has(a) && accessLocked()) { noAccessToast(); return; }
      switch (a) {
        case 'tab': haptic('select'); setView(v); break;
        case 'day-prev': haptic('select'); S.date = shiftKey(dayKey(), -1); loadDay(); break;
        case 'day-next': {
          haptic('select');
          const next = shiftKey(dayKey(), 1);
          S.date = next >= todayKey() ? null : next;
          loadDay();
          break;
        }
        case 'pick-date': {
          const p = $('dayPicker');
          p.value = dayKey();
          p.max = todayKey();
          try { p.showPicker ? p.showPicker() : p.click(); } catch (e) { p.click(); }
          break;
        }
        case 'period': periodSheet(v); break;
        case 'reload-day': loadDay(); break;
        case 'focus-capture': captureInput.focus(); break;
        case 'open': {
          const item = S.idx[el.dataset.kind] && S.idx[el.dataset.kind][id];
          if (item) OPENERS[el.dataset.kind](item);
          break;
        }
        case 'task-filter': haptic('select'); S.taskFilter = v; setPressed('[data-action="task-filter"]', v); loadTasks(); break;
        case 'reload-tasks': loadTasks(); break;
        case 'new-task': taskSheet(null); break;
        case 'toggle-task': toggleTask(id, el); break;
        case 'clear-note-search': S.noteQuery = ''; $('notesSearch').value = ''; loadNotes(); break;
        case 'pick-day': haptic('select'); S.date = v === todayKey() ? null : v; loadDay(); break;
        case 'reload-notes': loadNotes(); break;
        case 'new-note': noteSheet(null); break;
        case 'reveal-note': {
          S.revealed.add(id); haptic('light');
          const n = S.idx.note[id];
          el.closest('.field').remove();
          $('nContent').closest('.field').hidden = false;
          if (n) $('nContent').value = n.content || '';
          break;
        }
        case 'copy-note': copyText($('nContent').value); break;
        case 'word-mode': haptic('select'); S.wordMode = v; S.cardFlipped = false; savePrefs(); setPressed('[data-action="word-mode"]', v); loadWords(); break;
        case 'top-home': haptic('light'); T.screen = 'groups'; renderTop(); break;
        case 'top-locked': haptic('warning'); toast('Сначала решите группу ' + (id - 1) + ' ' + TOP_NEED + ' раза без ошибок'); break;
        case 'top-group': if (!topUnlocked(id)) break; haptic('light'); T.screen = 'group'; T.group = id; renderTop(); break;
        case 'top-study': if (!topUnlocked(id)) break; haptic('light'); T.screen = 'study'; T.group = id; T.idx = 0; T.flipped = false; renderTop(); break;
        case 'top-flip': haptic('light'); T.flipped = true; renderTop(); break;
        case 'top-prev': haptic('light'); if (T.idx > 0) { T.idx--; T.flipped = false; renderTop(); } break;
        case 'top-next': topNextCard(); break;
        case 'top-test': topStartTest(id); break;
        case 'top-answer': topAnswer(id); break;
        case 'top-after': topAfterAnswer(); break;
        case 'top-quit': haptic('light'); T.screen = T.quiz && T.quiz.group ? 'group' : 'groups'; if (T.quiz && T.quiz.group) T.group = T.quiz.group; renderTop(); break;
        case 'reload-words': loadWords(); break;
        case 'new-word': wordSheet(null); break;
        case 'debts': debtsSheet(false); break;
        case 'debts-owe': debtsSheet(true); break;
        case 'open-debt': if (S.debts && S.debts[id]) debtPaySheet(S.debts[id]); break;
        case 'debt-pay': payDebtAction(id, false); break;
        case 'debt-pay-all': payDebtAction(id, true); break;
        case 'flip': haptic('light'); S.cardFlipped = true; renderWords(); break;
        case 'card-next': haptic('light'); S.cardIdx = (S.cardIdx + 1) % S.words.length; S.cardFlipped = false; renderWords(); break;
        case 'card-prev': haptic('light'); S.cardIdx = (S.cardIdx - 1 + S.words.length) % S.words.length; S.cardFlipped = false; renderWords(); break;
        case 'open-review': openReview(); break;
        case 'review-confirm': reviewAct('confirm', el.dataset.key, el); break;
        case 'settings': settingsSheet(); break;
        case 'shortcut': shortcutSheet(); break;
        case 'terms': termsSheet(); break;
        case 'delete-me-ask': deleteMeSheet(); break;
        case 'delete-me-confirm': deleteMeAction(el); break;
        case 'token-issue': issueTokenAction(el); break;
        case 'token-copy': copyToken(); break;
        case 'sub-trial': subTrial(el); break;
        case 'sub-buy': subBuy(el); break;
        case 'recurring': recurringSheet(); break;
        case 'new-rec': recurringFormSheet(null); break;
        case 'make-rec': {
          const t = S.idx.finance[id];
          if (!t) break;
          const ts = parseTs(t.created_at);
          recurringFormSheet(null, {
            title: t.title || '', amount: t.original_amount !== undefined ? t.original_amount : t.amount,
            currency: t.original_currency || t.currency, category: t.category,
            day_of_month: ts ? Number(localKey(ts).slice(8, 10)) : Number(todayKey().slice(8, 10))
          });
          break;
        }
        case 'open-rec': if (S.recurring && S.recurring[id]) recurringFormSheet(S.recurring[id]); break;
        case 'review-edit': {
          // Saving the edited record also confirms it (the server clears the review flags on edit)
          const item = findReview(el.dataset.key);
          const kind = item && { finances: 'finance', tasks: 'task', notes: 'note' }[item.entity_type];
          if (kind) OPENERS[kind](item);
          break;
        }
        case 'review-merge': reviewAct('merge', el.dataset.key, el); break;
        case 'review-reject': reviewAct('reject', el.dataset.key, el); break;
        case 'review-cancel':
          if ($('sheet').open && $('sheet').dataset.kind === 'review') renderReviewSheet();
          else renderSections(dayKey());
          break;
        case 'close-sheet': closeSheet(); break;
        case 'ask-delete': askDelete(); break;
        case 'cancel-delete': cancelDelete(); break;
        case 'confirm-delete': confirmDelete(el); break;
        case 'mic': toggleRecording(); break;
      }
    });

    document.addEventListener('change', (ev) => {
      const k = ev.target.dataset && ev.target.dataset.change;
      if (k === 'currency') { S.currency = ev.target.value; savePrefs(); haptic('select'); loadDay(); }
      if (k === 'limit-toggle') {
        haptic('select');
        const field = $('limitField');
        if (field) {
          field.hidden = !ev.target.checked;
          if (ev.target.checked) $('sLimit').focus();
        }
      }
      if (k === 'rec-expense') {
        const field = $('recExpenseFields');
        if (field) field.hidden = !ev.target.checked;
      }
      if (k === 'date' && ev.target.value) {
        const v = ev.target.value > todayKey() ? todayKey() : ev.target.value;
        S.date = v === todayKey() ? null : v;
        loadDay();
      }
    });

    document.addEventListener('input', (ev) => {
      if (ev.target.dataset && ev.target.dataset.input === 'notes-search') {
        clearTimeout(noteSearchTimer);
        noteSearchTimer = setTimeout(() => { S.noteQuery = ev.target.value.trim(); loadNotes(); }, 250);
      }
    });

    $('sheet').addEventListener('submit', (ev) => { ev.preventDefault(); submitSheet(ev.target); });
    $('sheet').addEventListener('cancel', (ev) => { ev.preventDefault(); closeSheet(); });
    $('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) closeSheet(); });
    if (tg && tg.BackButton) { try { tg.BackButton.onClick(closeSheet); } catch (e) {} }

    $('captureForm').addEventListener('submit', (ev) => { ev.preventDefault(); if (accessLocked()) { noAccessToast(); return; } submitCapture(); });
    captureInput.addEventListener('input', () => { autoGrow(); syncCaptureButtons(); });
    captureInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); submitCapture(); }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { refresh(); loadAccess(); }
    });

    // ================= Boot =================
    async function boot() {
      loadPrefs();
      await loadProfile();
      loadAccess();
      applyTheme();
      $('currencySel').value = S.currency;
      setPressed('[data-action="word-mode"]', S.wordMode);
      syncCaptureButtons();
      // Telegram "Исправить" links here as ?open=finance:45: open that record once the day has loaded
      const open = new URLSearchParams(location.search).get('open');
      if (open && /^(finance|task|note|word):\d+$/.test(open)) {
        const [kind, id] = open.split(':');
        S.pendingOpen = { kind, id };
        S.view = 'day';
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
      }
      loadReview();
      setView(S.view);
      if (S.profile && !S.profile.setup_done) firstRunSheet(S.profile);
      const splash = $('splash');
      setTimeout(() => {
        splash.classList.add('out');
        setTimeout(() => splash.remove(), 350);
      }, 900);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>
</body>
</html>
