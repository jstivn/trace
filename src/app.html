<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Trace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23221A14'/%3E%3Cpath d='M8 22c3-1 4-9 8-9s2 7 6 7' fill='none' stroke='%23F4EFE6' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='11' r='2.4' fill='%23D9482B'/%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
/*{{FONTS_CSS}}*/

    /* ---------- Tokens ---------- */
    :root {
      --bg: #F4EFE6;
      --surface: #FBF8F2;
      --field: #FFFFFF;
      --sunk: #E9E2D5;
      --ink: #221A14;
      --ink-2: #5C4E42;
      --ink-3: #75665A;
      --line: rgba(34, 26, 20, 0.12);
      --line-strong: rgba(34, 26, 20, 0.20);
      --accent: #BF3B1F;
      --accent-ink: #FFFFFF;
      --accent-soft: rgba(191, 59, 31, 0.07);
      --danger: #8F1F2E;
      --danger-soft: rgba(143, 31, 46, 0.08);
      --warn-bg: #FBF1DE;
      --warn-line: rgba(166, 108, 20, 0.25);
      --warn-ink: #6B4A12;
      --warn-tile: #F6DDAE;
      --warn-icon: #7A4B05;
      --t-money-bg: #F3DCD2; --t-money: #A8341A;
      --t-task-bg: #DEE4EE;  --t-task: #34497A;
      --t-note-bg: #F0E4CC;  --t-note: #7A4B05;
      --t-word-bg: #E7E1F0;  --t-word: #5B4596;
      --shadow-sheet: 0 -8px 32px rgba(34, 26, 20, 0.08);
      --scrim: rgba(34, 26, 20, 0.38);
      --focus: #BF3B1F;

      --text-meta: 0.75rem;
      --text-secondary: 0.875rem;
      --text-body: 1rem;
      --text-h3: 1.25rem;
      --text-h1: 1.75rem;
      --text-hero: 3rem;

      --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 32px;

      --hit: 44px;
      --dock-h: 120px;
      --page-max: 560px;

      --motion-150: 150ms;
      --motion-200: 200ms;
      --motion-300: 300ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.7, 0, 0.84, 0);

      --font-ui: 'Golos Text', system-ui, -apple-system, sans-serif;
      --font-display: 'Instrument Serif', 'Golos Text', Georgia, serif;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font-ui); font-size: var(--text-body); font-weight: 400; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .num { font-variant-numeric: tabular-nums; }
    svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Shell ---------- */
    .page {
      width: 100%; max-width: var(--page-max); margin-inline: auto;
      padding: max(env(safe-area-inset-top), var(--s4)) var(--s5) calc(var(--dock-h) + env(safe-area-inset-bottom) + var(--s5));
    }
    .view-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: var(--hit); margin-bottom: var(--s4); }
    .view-head h1 { font-size: var(--text-h1); font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
    .head-actions { display: flex; align-items: center; gap: var(--s1); }

    .review-banner {
      display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--hit);
      margin-bottom: var(--s4); padding: var(--s3) var(--s4);
      background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); border-radius: var(--r-lg);
      text-align: left; font-size: var(--text-secondary); font-weight: 500;
    }
    .review-banner .grow { flex: 1; }

    /* ---------- Controls ---------- */
    .icon-btn {
      display: inline-grid; place-items: center; width: var(--hit); height: var(--hit);
      padding: 0; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink);
    }
    .icon-btn.solid { background: var(--accent); color: var(--accent-ink); }
    @media (hover: hover) { .icon-btn:not(.solid):hover { background: var(--sunk); } }
    /* No access (no subscription / it ended): the buttons that create things are dimmed; a tap explains and offers the subscription */
    body.no-access :is([data-action="new-task"], [data-action="new-note"], [data-action="new-word"], [data-action="new-rec"], [data-action="mic"], #sendBtn) { opacity: .45; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      min-height: var(--hit); padding: 0 var(--s4);
      border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--field); color: var(--ink);
      font-size: var(--text-secondary); font-weight: 500; white-space: nowrap;
    }
    .btn.small { min-height: 36px; padding: 0 var(--s3); border-radius: 10px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.danger { background: var(--danger); border-color: var(--danger); color: #FFF; }
    .btn.danger-quiet { color: var(--danger); border-color: transparent; background: transparent; padding-inline: var(--s2); }
    .btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: var(--s2); }
    .btn[aria-busy="true"] { opacity: 0.7; }

    .segmented { display: flex; gap: 2px; padding: 3px; margin-bottom: var(--s4); background: var(--sunk); border-radius: var(--r-md); }
    .segmented button {
      flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent;
      color: var(--ink-2); font-size: var(--text-secondary); font-weight: 500;
    }
    .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

    .select-quiet {
      appearance: none; -webkit-appearance: none; height: var(--hit); padding: 0 var(--s2);
      border: 0; border-radius: var(--r-md); background: transparent; color: var(--accent);
      font-size: var(--text-secondary); font-weight: 500; text-align: right;
    }

    .chips { display: flex; gap: var(--s2); overflow-x: auto; margin: 0 calc(var(--s5) * -1) var(--s4); padding: 0 var(--s5); scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 18px;
      background: var(--surface); color: var(--ink-2); font-size: var(--text-secondary); font-weight: 500;
    }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    .search { position: relative; margin-bottom: var(--s3); }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
    .search input {
      width: 100%; height: var(--hit); padding: 0 var(--s3) 0 40px;
      border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--field); font-size: var(--text-body);
    }
    .search input::placeholder { color: var(--ink-3); }

    /* ---------- Day: header, hero, ruler ---------- */
    .day-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 calc(var(--s3) * -1); }
    .day-nav .date-btn {
      min-height: var(--hit); padding: 0 var(--s2); border: 0; background: transparent; border-radius: var(--r-md);
      font-size: var(--text-secondary); font-weight: 500; color: var(--ink-2);
    }
    .day-nav .side { display: flex; align-items: center; min-width: 88px; }
    .day-nav .side.end { justify-content: flex-end; }
    .date-input-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .hero { margin-top: var(--s2); }
    .hero-label { font-size: var(--text-body); font-weight: 500; line-height: 1.5; color: var(--ink-2); }
    .hero-amount { font-family: var(--font-display); font-size: 3.5rem; font-weight: 400; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }    .hero-caption { margin-top: var(--s1); font-size: var(--text-secondary); color: var(--ink-2); }
    .hero-caption .over { color: var(--danger); font-weight: 500; }

    /* Last 7 days: one column per day, dashed line = daily limit */
    .week { margin-top: 18px; padding: var(--s3) var(--s2) var(--s2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); }
    .week-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--s2) var(--s2); font-size: var(--text-secondary); color: var(--ink-2); }
    .week-head .num { font-weight: 500; color: var(--ink); }
    .week-bars { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
    .week-limit { position: absolute; left: var(--s1); right: var(--s1); border-top: 1.5px dashed var(--line-strong); pointer-events: none; }
    .wday {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--s1);
      height: 156px; padding: var(--s1) 0; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-3);
    }
    @media (hover: hover) { .wday:hover { background: var(--accent-soft); } }
    .wday .amt { font-size: var(--text-meta); line-height: 1.4; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .wday .col {
      display: block; width: 62%; max-width: 30px; min-height: 4px; border-radius: 6px; background: #CDBFAC;
    }
    .wday.over .col { background: #D9A596; }
    .wday .dname { font-size: var(--text-meta); line-height: 1.4; font-weight: 500; }
    .wday[aria-pressed="true"] .col { background: var(--accent); box-shadow: none; }
    .wday[aria-pressed="true"].over .col { background: var(--danger); }
    .wday[aria-pressed="true"] .dname, .wday[aria-pressed="true"] .amt { color: var(--ink); font-weight: 600; }

    .period-links { display: flex; gap: var(--s2); margin-top: var(--s3); }

    /* ---------- Lists: every entry is its own card ---------- */
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin: var(--s5) var(--s1) var(--s2); }
    .sec-head h2 { font-size: var(--text-body); font-weight: 600; line-height: 1.35; }
    .sec-head span { font-size: var(--text-secondary); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
    .cards > li.card-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .cards > li.card-item.review { background: var(--warn-bg); border-color: var(--warn-line); }
    .cards > li.group { padding: var(--s3) var(--s1) 0; font-size: var(--text-meta); line-height: 1.4; font-weight: 500; color: var(--ink-3); }
    .cards > li.group:first-child { padding-top: 0; }
    .cards > li.group.danger { color: var(--danger); }

    .row {
      display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px;
      padding: var(--s3) var(--s4); border: 0; background: transparent; text-align: left;
    }
    @media (hover: hover) { .row:hover { background: var(--accent-soft); } }
    .row:focus-visible { outline-offset: -2px; border-radius: 0; }
    .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .row-title { font-size: var(--text-body); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
    .row-sub { font-size: var(--text-secondary); color: var(--ink-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row-meta { font-size: var(--text-meta); line-height: 1.4; color: var(--ink-3); }
    .row-meta .due-over { color: var(--danger); font-weight: 500; }
    .row-meta .due-today { color: var(--accent); font-weight: 500; }
    .row-end { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .row-amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .row-orig { font-size: var(--text-meta); color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .row.done .row-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }

    /* Kind tiles */
    .kind { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 10px; }
    .kind svg.i { width: 18px; height: 18px; }
    .k-money { background: var(--t-money-bg); color: var(--t-money); }
    .k-task { background: var(--t-task-bg); color: var(--t-task); }
    .k-note { background: var(--t-note-bg); color: var(--t-note); }
    .k-word { background: var(--t-word-bg); color: var(--t-word); }
    .k-warn { background: var(--warn-tile); color: var(--warn-icon); }

    /* Task check (tile in the day feed, circle in the task list) */
    .task-row { display: flex; align-items: stretch; }
    .task-row .row { padding-left: 0; }
    .check { flex: none; display: grid; place-items: center; width: 60px; min-height: 60px; padding: 0 0 0 var(--s2); border: 0; background: transparent; }
    .check .ring {
      display: grid; place-items: center; width: 22px; height: 22px;
      border: 1.75px solid var(--line-strong); border-radius: 50%; color: transparent;
    }
    .check.high .ring { border-color: var(--danger); }
    .check[aria-pressed="true"] .ring { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .check.tile { width: auto; padding: 0 0 0 var(--s4); }
    .task-row .check.tile + .row { padding-left: var(--s3); }
    .check[aria-pressed="true"] .kind { background: var(--accent); color: var(--accent-ink); }
    .check svg.tick { width: 14px; height: 14px; stroke-width: 2.5; opacity: 0; transform: scale(0.6); transition: opacity var(--motion-150) var(--ease-out), transform var(--motion-150) var(--ease-out); }
    .check[aria-pressed="true"] svg.tick { opacity: 1; transform: none; }
    .check .kind svg.tick { width: 18px; height: 18px; }
    .check .kind svg.box { display: block; }
    .check[aria-pressed="true"] .kind svg.box { display: none; }
    .check:not([aria-pressed="true"]) .kind svg.tick { display: none; }
    .prio { color: var(--danger); font-weight: 500; }

    /* Review entries inline */
    .review-entry { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); }
    .review-entry .row-main { gap: var(--s1); }
    .review-entry .head { display: flex; justify-content: space-between; gap: var(--s2); }
    .review-entry .note { font-size: var(--text-secondary); color: var(--warn-ink); }
    .review-actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s1); }
    .review-actions .confirm-text { flex-basis: 100%; font-size: var(--text-secondary); font-weight: 500; }

    .masked { letter-spacing: 0.15em; color: var(--ink-3); }

    /* ---------- States ---------- */
    .state { padding: var(--s6) var(--s5); text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
    .state h2 { font-size: var(--text-body); font-weight: 600; line-height: 1.35; }
    .state p { margin: var(--s1) auto 0; max-width: 34ch; font-size: var(--text-secondary); color: var(--ink-2); }
    .state .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
    .skeleton { padding: var(--s4); display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
    .skeleton div { height: 14px; border-radius: 7px; background: var(--sunk); }
    .skeleton div:nth-child(2n) { width: 62%; }
    .gate { min-height: 70vh; display: grid; place-items: center; }

    /* ---------- Flashcard ---------- */
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2);
      width: 100%; min-height: 240px; padding: var(--s6) var(--s5);
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); text-align: center;
    }
    #view-words.words-focus .view-head, #view-words.words-focus .segmented { display: none; }
    .quiz-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
    .quiz-card { min-height: 112px; padding: var(--s4) var(--s5); gap: var(--s1); }
    .card-sent { font-size: 1.3rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; overflow-wrap: anywhere; }
    .card-sent mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 3px; }
    .card-sent .blank { display: inline-block; min-width: 3.4em; border-bottom: 2px solid var(--accent); }
    .card-sent-ru { font-size: var(--text-secondary); color: var(--ink-2); line-height: 1.35; }
    .card-sent-ru.is-hidden { visibility: hidden; }
    .quiz-ask { color: var(--ink-2); font-size: var(--text-secondary); }
    .card-word { font-size: 2rem; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .card-phon { font-size: var(--text-secondary); color: var(--ink-2); }
    .card-back { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line); width: 100%; }
    .card-trans { font-size: var(--text-h3); font-weight: 500; line-height: 1.3; }
    .card-ex { margin-top: var(--s2); font-size: var(--text-secondary); color: var(--ink-2); }
    .card-nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); }
    .card-count { color: var(--ink-2); font-variant-numeric: tabular-nums; }

    /* ---------- Top-1000: groups and tests ---------- */
    .top-head { margin: var(--s2) 0 var(--s3); }
    .top-head p { color: var(--ink-2); font-size: var(--text-secondary); }
    .top-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: var(--s2); }
    .top-bar > span { display: block; height: 100%; background: var(--accent); }
    .sub-line { display: flex; justify-content: space-between; gap: var(--s3); }
    .sub-line .until { color: var(--accent); }
    .sub-card .top-bar { margin-bottom: var(--s3); }
    .sub-card .btn { width: 100%; margin-top: var(--s2); }
    .top-stack { display: grid; gap: var(--s3); }
    .kind.k-num { font-weight: 600; font-variant-numeric: tabular-nums; }
    .quiz-opts { display: grid; gap: var(--s2); }
    .quiz-opts .btn { width: 100%; justify-content: flex-start; text-align: left; height: auto; min-height: 48px; padding-top: 10px; padding-bottom: 10px; }
    .quiz-next { position: sticky; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom) + var(--s3)); z-index: 5; width: 100%; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); }
    .quiz-opts .btn.is-right { border-color: #2F7D4F; background: rgba(47, 125, 79, .16); }
    .quiz-opts .btn.is-wrong { border-color: var(--danger); background: rgba(143, 31, 46, .14); }
    .top-score { font-size: 3rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* ---------- Dock ---------- */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .dock-inner { max-width: var(--page-max); margin-inline: auto; }
    .capture { display: flex; align-items: flex-end; gap: var(--s2); padding: 10px 14px 0; }
    .capture-field { flex: 1; display: flex; align-items: center; min-height: 48px; background: var(--bg); border: 1px solid transparent; border-radius: 24px; }
    .capture-field:focus-within { border-color: var(--accent); }
    .capture textarea {
      flex: 1; resize: none; border: 0; background: transparent; max-height: 120px; height: 48px;
      padding: 12px var(--s4); font-size: var(--text-body); line-height: 1.5; overflow-y: hidden; scrollbar-width: none;
    }
    .capture textarea.scroll { overflow-y: auto; }
    .capture textarea:focus-visible { outline: none; }
    .capture textarea::placeholder { color: var(--ink-3); }
    .capture .icon-btn { width: 48px; height: 48px; border-radius: 24px; }
    .capture .rec { background: var(--danger); color: #FFF; }
    .rec-time { flex: 1; padding: 0 var(--s4); color: var(--danger); font-variant-numeric: tabular-nums; }
    .tabs { display: flex; padding: var(--s1) var(--s2) 2px; }
    .tabs button {
      flex: 1; min-height: 48px; border: 0; background: transparent; border-radius: var(--r-md);
      color: var(--ink-3); font-size: var(--text-secondary); font-weight: 500;
    }
    .tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

    /* ---------- Sheet ---------- */
    dialog.sheet {
      position: fixed; inset: auto 0 0 0; margin: 0 auto; padding: 0;

    .switch-row input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform var(--motion-150) var(--ease-out); }

  <script>
    // ================= Auth-aware fetch =================
    // Telegram-signed initData (Mini App) or a saved AUTH_TOKEN
    // (open the page once as /app?token=... in a regular browser to store it).
    (function () {
      const nativeFetch = window.fetch.bind(window);
      let token = '';
      try {
        const q = new URLSearchParams(location.search).get('token');
        if (q) {
          localStorage.setItem('trace_token', q);
          history.replaceState(null, '', location.pathname);
        }
        token = localStorage.getItem('trace_token') || '';
      } catch (e) {}
      window.fetch = function (input, init) {
        const target = typeof input === 'string' ? input : (input && input.url) || '';
        if (target.startsWith('/api/')) {
          init = Object.assign({}, init);
          const headers = new Headers(init.headers || {});
          const initData = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
          if (initData) headers.set('X-Telegram-Init-Data', initData);
          if (token) headers.set('X-Token', token);
          init.headers = headers;
        }
        return nativeFetch(input, init);
      };
    })();

    // ================= Constants =================
    const TZ = 'Asia/Ho_Chi_Minh';
    let TZ_OFFSET_MS = 7 * 3600000; // replaced by the person's own zone once /api/settings answers (see loadProfile)
    const DAY_MS = 86400000;

    const CATEGORIES = { food: 'Еда', car: 'Транспорт', tech: 'IT и софт', services: 'Аренда и сервисы', other: 'Прочее' };
    const KIND_NAMES = { finances: 'Расход', tasks: 'Задача', notes: 'Заметка' };

    const S = {
      view: 'day',
      currency: 'VND',
      date: null,             // YYYY-MM-DD of the day view; null = today
      day: null,              // { finance, tasks, notes, words }
      taskFilter: 'active',
      tasks: [],
      noteQuery: '',
      notes: [],
      words: [],
      wordMode: 'top',
      cardIdx: 0,
      cardFlipped: false,
      review: [],
      revealed: new Set(),
      idx: { finance: {}, task: {}, note: {}, word: {} }
    };

    const tg = window.Telegram && window.Telegram.WebApp;
    const $ = (id) => document.getElementById(id);

    // ================= Preferences =================
    function loadPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem('trace_prefs') || '{}');
        if (p.currency) S.currency = p.currency;
        if (p.view && ['day', 'tasks', 'notes', 'words'].includes(p.view)) S.view = p.view;
        if (p.wordMode && p.wordsV === 2) S.wordMode = p.wordMode;   // older saves know only cards/list: start on the Top-1000
      } catch (e) {}
    }
    function savePrefs() {
      try { localStorage.setItem('trace_prefs', JSON.stringify({ currency: S.currency, view: S.view, wordMode: S.wordMode, wordsV: 2 })); } catch (e) {}
    }

    // ================= Theme / Telegram =================
    // The app always uses the light "Ink" palette (cream paper, vermilion accent); Telegram's own chrome is painted to match
    function applyTheme() {
      const inTelegram = tg && tg.platform && tg.platform !== 'unknown';
      document.documentElement.dataset.theme = 'light';
      if (inTelegram) {
        const css = getComputedStyle(document.documentElement);
        try {
          tg.setHeaderColor(css.getPropertyValue('--bg').trim());
          tg.setBackgroundColor(css.getPropertyValue('--bg').trim());
          if (tg.setBottomBarColor) tg.setBottomBarColor(css.getPropertyValue('--surface').trim());
        } catch (e) {}
      }
    }
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type) {
      const h = tg && tg.HapticFeedback;
      if (!h) return;
      try {
        if (type === 'success' || type === 'warning' || type === 'error') h.notificationOccurred(type);
        else if (type === 'select') h.selectionChanged();
        else h.impactOccurred(type || 'light');
      } catch (e) {}
    }

    // ================= Helpers =================
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function group3(v, dec) {
      const parts = Math.abs(v).toFixed(dec).split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return (v < 0 ? '−' : '') + parts.join(',');
    }
    function money(amount, cur) {
      const n = Number(amount || 0);
      if (cur === 'VND') return group3(Math.round(n), 0) + ' ₫';
      if (cur === 'RUB') return group3(Math.round(n), 0) + ' ₽';
      if (cur === 'USD') return '$' + group3(n, n >= 1000 ? 0 : 2);
      if (cur === 'KZT') return group3(Math.round(n), 0) + ' ₸';
      if (cur === 'UAH') return group3(n, n >= 1000 ? 0 : 2) + ' ₴';
      if (cur === 'EUR') return group3(n, n >= 1000 ? 0 : 2) + ' €';
      return group3(n, 2) + ' ' + (cur || '');
    }
    function parseTs(v) {
      if (!v) return null;
      let s = String(v).trim();
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(s)) s = s.replace(' ', 'T') + 'Z';
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function localKey(d) { return new Date(d.getTime() + TZ_OFFSET_MS).toISOString().slice(0, 10); }
    function todayKey() { return localKey(new Date()); }
    function shiftKey(key, days) { return new Date(Date.parse(key + 'T00:00:00Z') + days * DAY_MS).toISOString().slice(0, 10); }
    function longDate(key, weekday) {
      const opts = { timeZone: 'UTC', day: 'numeric', month: 'long' };
      if (weekday) opts.weekday = 'long';
      if (key.slice(0, 4) !== todayKey().slice(0, 4)) opts.year = 'numeric';
      const s = new Date(key + 'T00:00:00Z').toLocaleDateString('ru-RU', opts);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function dayName(key, withWeekday) {
      const t = todayKey();
      if (key === t) return 'Сегодня';
      if (key === shiftKey(t, -1)) return 'Вчера';
      if (key === shiftKey(t, 1)) return 'Завтра';
      const opts = { timeZone: 'UTC', day: 'numeric', month: 'long' };
      if (withWeekday) opts.weekday = 'short';
      if (key.slice(0, 4) !== t.slice(0, 4)) opts.year = 'numeric';
      return new Date(key + 'T00:00:00Z').toLocaleDateString('ru-RU', opts);
    }
    function timeOf(d) { return d ? d.toLocaleTimeString('ru-RU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }) : ''; }
    function plural(n, one, few, many) {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return one;
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
      return many;
    }
    function icon(id, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '"><use href="#i-' + id + '"/></svg>'; }
    function remember(kind, list) { (list || []).forEach(x => { S.idx[kind][x.id] = x; }); }

    // ================= API =================
    class AuthError extends Error {}
    class SubscriptionError extends Error {}
    let subNoticeAt = 0; // the subscription toast is already on screen, so a generic failure toast must not cover it
    async function api(path, opts) {
      opts = opts || {};
      const init = { method: opts.method || 'GET' };
      if (opts.body !== undefined) {
        init.headers = { 'Content-Type': 'application/json' };
        init.body = JSON.stringify(opts.body);
      }
      let res;
      try { res = await fetch(path, init); }
      catch (e) { throw new Error('network'); }
      let data = {};
      if (res.status === 403) {
        // Not a bad token: the person has no access to create new records
        try { data = await res.clone().json(); } catch (e) {}
        if (data.code === 'subscription_required') {
          subNoticeAt = Date.now();
          haptic('error');
          toast(data.error || 'Подписка закончилась', { label: 'Подписка', run: settingsSheet });
          throw new SubscriptionError(data.error || 'subscription_required');
        }
      }
      if (res.status === 401 || res.status === 403) {
        showGate();
        throw new AuthError('auth');
      }
      try { data = await res.json(); } catch (e) {}
      if (!res.ok || data.ok === false) {
        const err = new Error(data.error || ('HTTP ' + res.status));
        err.detail = { path, status: res.status, error: data.error || null, at: new Date().toISOString() };
        throw err;
      }
      return data;
    }

    // ================= Toast =================
    let toastTimer = null;
    function toast(msg, action) {
      const btn = $('toastAction');
      $('toastMsg').textContent = msg;
      if (action) {
        btn.textContent = action.label;
        btn.hidden = false;
        btn.onclick = () => { hideToast(); action.run(); };
      } else {
        btn.hidden = true;
        btn.onclick = null;
      }
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, action ? 6000 : 3000);
    }
    function hideToast() { $('toast').classList.remove('show'); }
    function failToast(what, retry) {
      if (Date.now() - subNoticeAt < 2000) return;
      haptic('error');
      toast('Не удалось ' + what + '. Проверьте соединение и попробуйте снова.', retry ? { label: 'Повторить', run: retry } : null);
    }

    // ================= Frame states =================
    const skeletonTimers = {};
    function startLoading(frameId) {
      clearTimeout(skeletonTimers[frameId]);
      const frame = $(frameId);
      // No loader for fast responses; the skeleton only appears if loading takes over 300ms
      skeletonTimers[frameId] = setTimeout(() => {
        if (!frame) return;
        frame.setAttribute('aria-busy', 'true');
        if (!frame.innerHTML.trim()) frame.innerHTML = '<div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div></div>';
      }, 300);
    }
    function stopLoading(frameId) {
      clearTimeout(skeletonTimers[frameId]);
      const frame = $(frameId);
      if (frame) frame.removeAttribute('aria-busy');
    }
    function stateHtml(title, text, actions) {
      return '<div class="state"><h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') +
        (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
    }
    function errorState(frameId, what, retryAction) {
      stopLoading(frameId);
      $(frameId).innerHTML = stateHtml('Не удалось загрузить ' + what,
        'Проверьте соединение и попробуйте снова. Сохранённые данные не пострадали.',
        '<button type="button" class="btn primary" data-action="' + retryAction + '">Повторить загрузку</button>');
    }
    function showGate() {
      document.querySelectorAll('main.page').forEach(m => { m.hidden = m.id !== 'view-gate'; });
      $('dock').hidden = true;
    }

    // ================= Navigation =================
    function setView(view) {
      S.view = view;
      savePrefs();
      document.querySelectorAll('main[data-view]').forEach(m => { m.hidden = m.dataset.view !== view; });
      document.querySelectorAll('.tabs button').forEach(b => {
        if (b.dataset.value === view) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      window.scrollTo(0, 0);
      syncCapturePlaceholder();
      loadView();
      renderReviewBanner();
    }
    function loadView() {
      if (S.view === 'day') loadDay();
      else if (S.view === 'tasks') loadTasks();
      else if (S.view === 'notes') loadNotes();
      else if (S.view === 'words') loadWords();    }
    function refresh() { loadView(); loadReview(); }

    // A record named in the start URL: found among the day's lists or, if it is still unchecked, in the review queue
    function tryPendingOpen() {
      const p = S.pendingOpen;
      if (!p || !S.day) return;
      const table = { finance: 'finances', task: 'tasks', note: 'notes' }[p.kind];
      const item = (S.idx[p.kind] && S.idx[p.kind][p.id]) ||
        (S.review || []).find(i => i.entity_type === table && String(i.id) === p.id);
      if (!item) return;
      S.pendingOpen = null;
      OPENERS[p.kind](item);
    }
    function setPressed(selector, value) {
      document.querySelectorAll(selector).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
    }

    // ================= Day =================
    function dayKey() { return S.date || todayKey(); }

    // A past day open on the Day tab: what is captured there is filed under that day
    function captureDay() { return S.view === 'day' && S.date && S.date < todayKey() ? S.date : null; }
    function syncCapturePlaceholder() {
      const d = captureDay();
      const name = d ? dayName(d) : '';
      captureInput.placeholder = d ? 'Что было ' + (name === 'Вчера' ? 'вчера' : name) + '?' : 'Что сейчас было?';
    }

    let dayReq = 0;
    async function loadDay() {
      const key = dayKey();
      const req = ++dayReq;
      const isToday = key === todayKey();
      $('dayLabel').textContent = longDate(key, true);
      $('dayNext').style.visibility = isToday ? 'hidden' : 'visible';
      syncCapturePlaceholder();
      $('dayHeroLabel').textContent = isToday ? 'Сегодня потрачено' : key === shiftKey(todayKey(), -1) ? 'Вчера потрачено' : 'Потрачено ' + dayName(key);

      startLoading('dayFrame');
      const finUrl = '/api/finances?currency=' + S.currency + (isToday ? '&period=day' : '&date=' + key);
      try {
        const [finance, week, tasks, notes, words] = await Promise.all([
          api(finUrl),
          api('/api/finances?period=week&currency=' + S.currency),
          api('/api/tasks?filter=all'),
          api('/api/notes?q='),
          api('/api/vocabulary')
        ]);
        if (req !== dayReq) return; // a newer load (other day, currency or a refresh) owns the screen
        S.day = { finance, week, tasks: tasks.tasks || [], notes: notes.notes || [], words: words.words || words.vocabulary || [] };
        remember('finance', finance.transactions);
        remember('task', S.day.tasks);
        remember('note', S.day.notes);
        remember('word', S.day.words);
        stopLoading('dayFrame');
        renderDay();
      } catch (e) {
        if (e instanceof AuthError || req !== dayReq) return;
        errorState('dayFrame', 'день', 'reload-day');
      }
    }

    function dayReviewItems(key) {
      return S.review.filter(i => { const t = parseTs(i.created_at); return t && localKey(t) === key; });
    }

    function renderDay() {
      const d = S.day;
      if (!d) return;
      const key = dayKey();
      const total = Number(d.finance.total || 0);
      const limit = Number(d.finance.limit || 0);
      $('dayTotal').textContent = money(total, S.currency);
      if (limit > 0) {
        $('dayCaption').innerHTML = '<button type="button" class="caption-btn" data-action="settings" aria-label="Дневной лимит, изменить">Лимит ' + esc(money(limit, S.currency)) + '</button>, ' + (total > limit
          ? '<span class="over">сверх на ' + esc(money(total - limit, S.currency)) + '</span>'
          : 'осталось ' + esc(money(limit - total, S.currency)));
      } else {
        $('dayCaption').innerHTML = '<button type="button" class="caption-btn off" data-action="settings">Дневной лимит выключен</button>';
      }
      renderWeek(key);
      renderSections(key);
      renderReviewBanner();
      tryPendingOpen();
    }

    // Short amounts for the column labels: 45к, 3,5м, $17
    function moneyShort(n, cur) {
      n = Number(n || 0);
      if (!n) return '0';
      if (cur === 'VND' || cur === 'RUB') {
        if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'м';
        if (n >= 1e3) return Math.round(n / 1e3) + 'к';
        return String(Math.round(n));
      }
      return (cur === 'USD' ? '$' : '') + (n >= 1000 ? Math.round(n / 100) / 10 + 'к' : Math.round(n));
    }

    function renderWeek(selectedKey) {
      const week = S.day.week || {};
      const limit = Number(week.daily_limit || 0);
      const today = todayKey();
      const totals = {};
      (week.transactions || []).forEach(t => {
        if (t.outside_limit) return; // planned purchase: not in the day's total
        const ts = parseTs(t.created_at);
        if (ts) totals[localKey(ts)] = (totals[localKey(ts)] || 0) + Number(t.amount || 0);
      });
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const k = shiftKey(today, -i);
        days.push({ key: k, total: totals[k] || 0 });
      }
      // One very large day (rent) must not flatten the rest: the scale tops out at 3x the daily limit
      const peak = Math.max(...days.map(d => d.total), limit, 1);
      const scaleMax = limit > 0 ? Math.min(peak, limit * 3) : peak;
      const H = 104; // column area height, px
      const sum = days.reduce((s, d) => s + d.total, 0);
      $('weekTotal').textContent = money(sum, S.currency);
      let html = '';
      if (limit > 0 && limit <= scaleMax) {
        html += '<span class="week-limit" style="bottom:' + Math.round(26 + (limit / scaleMax) * H) + 'px" aria-hidden="true"></span>';
      }
      html += days.map((d, i) => {
        const h = d.total > 0 ? Math.max(6, Math.round(Math.min(d.total, scaleMax) / scaleMax * H)) : 4;
        const over = limit > 0 && d.total > limit;
        const date = new Date(d.key + 'T00:00:00Z');
        const dname = d.key === today ? 'Сег' : date.toLocaleDateString('ru-RU', { timeZone: 'UTC', weekday: 'short' });
        const label = longDate(d.key, true) + ': ' + money(d.total, S.currency) + (over ? ', выше лимита' : '');
        return '<button type="button" class="wday' + (over ? ' over' : '') + '" data-action="pick-day" data-value="' + d.key + '" aria-pressed="' + (d.key === selectedKey) + '" aria-label="' + esc(label) + '">' +
          '<span class="amt">' + esc(moneyShort(d.total, S.currency)) + '</span>' +
          '<span class="col" style="height:' + h + 'px"></span>' +
          '<span class="dname">' + esc(dname) + '</span></button>';
      }).join('');
      $('weekBars').innerHTML = html;
    }

    function taskDue(t) {
      if (!t.due_datetime) return null;
      if (t.is_date_only) {
        const key = String(t.due_datetime).slice(0, 10);
        return { key, dateOnly: true, ts: Date.parse(key + 'T23:59:59Z') - TZ_OFFSET_MS };
      }
      const d = parseTs(t.due_datetime);
      if (!d) return null;
      return { key: localKey(d), dateOnly: false, ts: d.getTime(), time: timeOf(d) };
    }

    function buildFeed(key) {
      const d = S.day;
      const items = [];
      (d.finance.transactions || []).forEach(t => {
        const ts = parseTs(t.created_at);
        if (ts) items.push({ kind: 'finance', ts: ts.getTime(), data: t });
      });
      d.notes.forEach(n => {
        const ts = parseTs(n.created_at);
        if (ts && localKey(ts) === key) items.push({ kind: 'note', ts: ts.getTime(), data: n });
      });
      d.words.forEach(w => {
        const ts = parseTs(w.created_at);
        if (ts && localKey(ts) === key) items.push({ kind: 'word', ts: ts.getTime(), data: w });
      });
      d.tasks.forEach(t => {
        if (t.needs_review || t.possible_duplicate) return; // shown as a review entry instead
        const due = taskDue(t);
        const created = parseTs(t.created_at);
        if (due && due.key === key && !t.is_completed) {
          // planned for this day: sits at its due time; all-day tasks go on top
          items.push({ kind: 'task', ts: due.dateOnly ? Infinity : due.ts, data: t, allDay: due.dateOnly });
        } else if (created && localKey(created) === key) {
          items.push({ kind: 'task', ts: created.getTime(), data: t });
        }
      });
      dayReviewItems(key).forEach(r => {
        const ts = parseTs(r.created_at);
        items.push({ kind: 'review', ts: ts.getTime(), data: r });
      });
      return items.sort((a, b) => b.ts - a.ts);
    }

    // The day is split into separate blocks: what needs checking, spending, tasks, notes, words
    function renderSections(key) {
      const frame = $('dayFrame');
      const items = buildFeed(key);
      if (!items.length) {
        frame.innerHTML = '<div style="margin-top:var(--s5)">' + stateHtml(key === todayKey() ? 'Сегодня пока пусто' : 'За этот день записей нет',
          'Скажите или напишите внизу, что произошло: «кофе 45к», «позвонить Ахмеду в 10». Запись появится здесь.',
          '<button type="button" class="btn primary" data-action="focus-capture">Написать запись</button>') + '</div>';
        return;
      }
      const of = (kind) => items.filter(i => i.kind === kind);
      const spend = of('finance').reduce((s, i) => s + Number(i.data.amount || 0), 0);
      const blocks = [
        { title: 'Проверить', list: of('review'), aside: '' },
        { title: 'Траты', list: of('finance'), aside: money(spend, S.currency) },
        { title: 'Задачи', list: of('task'), aside: '' },
        { title: 'Заметки', list: of('note'), aside: '' },
        { title: 'Новые слова', list: of('word'), aside: '' }
      ];
      frame.innerHTML = blocks.filter(b => b.list.length).map(b =>
        '<section><div class="sec-head"><h2>' + b.title + '</h2><span>' + esc(b.aside || String(b.list.length)) + '</span></div>' +
        '<ul class="cards">' + b.list.map(it => {
          if (it.kind === 'review') return '<li class="card-item review">' + reviewEntryHtml(it.data) + '</li>';
          if (it.kind === 'task') return taskFeedRow(it);
          return '<li class="card-item">' + feedRow(it) + '</li>';
        }).join('') + '</ul></section>'
      ).join('');
    }

    function feedRow(it) {
      const ts = new Date(it.ts);
      if (it.kind === 'finance') {
        const t = it.data;
        const catName = CATEGORIES[t.category] || CATEGORIES.other;
        const cat = /^[A-ZА-Я]{2}/.test(catName) ? catName : catName.toLowerCase(); // keep "IT" as is
        const orig = t.original_currency && t.original_currency !== S.currency ? ', ' + money(t.original_amount, t.original_currency) : '';
        return '<button type="button" class="row" data-action="open" data-kind="finance" data-id="' + t.id + '">' +
          '<span class="kind k-money">' + icon('wallet') + '</span>' +
          '<span class="row-main"><span class="row-title">' + esc(t.title || t.raw_text || 'Расход') + '</span>' +
          '<span class="row-meta">' + esc(timeOf(ts) + ', ' + cat + orig + (t.is_debt ? ', долг' : t.outside_limit ? ', вне лимита' : '')) + '</span></span>' +
          '<span class="row-end"><span class="row-amount">' + esc(money(t.amount, S.currency)) + '</span></span></button>';
      }
      if (it.kind === 'note') {
        const n = it.data;
        const secret = n.category === 'credentials';
        return '<button type="button" class="row" data-action="open" data-kind="note" data-id="' + n.id + '">' +
          '<span class="kind k-note">' + icon('note') + '</span>' +
          '<span class="row-main"><span class="row-title">' + esc(n.title || 'Заметка') + '</span>' +
          (secret ? '' : (n.content ? '<span class="row-sub">' + esc(n.content) + '</span>' : '')) +
          '<span class="row-meta">' + esc(timeOf(ts)) + '</span></span></button>';
      }
      const w = it.data;
      return '<button type="button" class="row" data-action="open" data-kind="word" data-id="' + w.id + '">' +
        '<span class="kind k-word">' + icon('book') + '</span>' +
        '<span class="row-main"><span class="row-title">' + esc(w.word) + '</span>' +
        '<span class="row-meta">' + esc(timeOf(ts) + ', ' + (w.translation || 'слово')) + '</span></span></button>';
    }

    function taskFeedRow(it) {
      const t = it.data;
      const isDone = !!t.is_completed;
      const due = taskDue(t);
      let meta;
      if (it.allDay) meta = 'Задача на весь день';
      else if (due && due.key === dayKey()) meta = 'Задача на ' + due.time;
      else if (due) meta = 'Задача на ' + dayName(due.key).toLowerCase() + (due.dateOnly ? '' : ', ' + due.time);
      else meta = timeOf(new Date(it.ts)) + ', задача';
      const overdue = due && !isDone && due.ts < Date.now();
      return '<li class="card-item task-row">' +
        '<button type="button" class="check tile" data-action="toggle-task" data-id="' + t.id + '" aria-pressed="' + isDone + '" aria-label="' + (isDone ? 'Вернуть в активные: ' : 'Отметить выполненной: ') + esc(t.title) + '">' +
          '<span class="kind k-task">' + icon('check-square', 'box') + icon('tick', 'tick') + '</span></button>' +
        '<button type="button" class="row' + (isDone ? ' done' : '') + '" data-action="open" data-kind="task" data-id="' + t.id + '">' +
          '<span class="row-main"><span class="row-title">' + esc(t.title) + '</span>' +
          '<span class="row-meta' + '">' + (t.priority === 'high' && !isDone ? '<span class="prio">Важно</span>, ' : '') +
            '<span class="' + (overdue ? 'due-over' : '') + '">' + esc(meta) + '</span></span></span></button></li>';
    }

    async function periodSheet(period) {
      openSheet({ title: period === 'week' ? 'Траты за 7 дней' : 'Траты за 30 дней', kind: 'period', body: '<div class="skeleton" aria-hidden="true"><div></div><div></div><div></div></div>', noFooter: true });
      let data;
      try {
        data = await api('/api/finances?period=' + period + '&currency=' + S.currency);
      } catch (e) {
        if (e instanceof AuthError) return;
        const b = $('sheet').querySelector('.sheet-body');
        if (b) b.innerHTML = stateHtml('Не удалось загрузить траты', 'Проверьте соединение и попробуйте снова.',
          '<button type="button" class="btn primary" data-action="period" data-value="' + period + '">Повторить загрузку</button>');
        return;
      }
      remember('finance', data.transactions);
      const body = $('sheet').querySelector('.sheet-body');
      if (!body) return;
      const total = Number(data.total || 0);
      const limit = Number(data.limit || 0);
      const cats = Object.keys(CATEGORIES).filter(k => Number(data.categories?.[k] || 0) > 0).sort((a, b) => data.categories[b] - data.categories[a]);
      let html = '<p class="period-total">' + esc(money(total, S.currency)) + '</p>' +
        (limit > 0 ? '<p class="hero-caption">Лимит на период ' + esc(money(limit, S.currency)) + ', ' + (total > limit
          ? '<span class="over">сверх на ' + esc(money(total - limit, S.currency)) + '</span>'
          : 'осталось ' + esc(money(limit - total, S.currency))) + '</p>' : '');
      if (cats.length) {
        html += '<ul class="cat-list">' + cats.map(k => {
          const v = Number(data.categories[k]);
          return '<li><span>' + esc(CATEGORIES[k]) + '</span><span class="num">' + esc(money(v, S.currency)) + '</span>' +
            '<span class="bar-track"><span class="bar-fill" style="display:block;transform:scaleX(' + (v / (total || 1)).toFixed(3) + ')"></span></span></li>';
        }).join('') + '</ul>';
      }

      const frame = $('taskFrame');

      if (!list.length) {
        frame.innerHTML = S.taskFilter === 'active'
          ? stateHtml('Активных задач нет', 'Напишите или скажите задачу внизу, например «завтра в 10 позвонить Ахмеду». Срок и напоминание поставятся сами.',

        return;
      }
      const now = Date.now();
      const today = todayKey();
      const buckets = [
        { id: 'over', title: 'Просрочено', items: [], cls: 'danger' },
        { id: 'today', title: 'Сегодня', items: [] },
        { id: 'tomorrow', title: 'Завтра', items: [] },

        { id: 'none', title: 'Без срока', items: [] }
      ];
      const done = S.taskFilter !== 'active';
      list.forEach(t => {
        if (done) { buckets[4].items.push(t); return; }
        const due = taskDue(t);
        if (!due) buckets[4].items.push(t);
        else if (due.ts < now && due.key <= today) buckets[0].items.push(t);
        else if (due.key === today) buckets[1].items.push(t);
        else if (due.key === shiftKey(today, 1)) buckets[2].items.push(t);
        else buckets[3].items.push(t);
      });
      buckets.slice(0, 4).forEach(b => b.items.sort((a, c) => (taskDue(a)?.ts || 0) - (taskDue(c)?.ts || 0)));
      const html = [];
      const showHeaders = !done && buckets.filter(b => b.items.length).length > 1;
      buckets.forEach(b => {
        if (!b.items.length) return;

    // ================= Top-1000 words: groups of 20, study cards, tests =================
    const T = { words: null, groups: {}, screen: 'groups', group: 0, idx: 0, flipped: false, quiz: null };
    const TOP_SIZE = 20;
    const TOP_NEED = 3;    // flawless (100%) test runs of a group that open the next one
    // group 1 is always open; group n opens after group n-1 was done flawlessly TOP_NEED times
    function topUnlocked(n) { return n <= 1 || ((T.groups[n - 1] || {}).perfect || 0) >= TOP_NEED; }

    function topWordsOf(g) { return g ? T.words.slice((g - 1) * TOP_SIZE, g * TOP_SIZE) : T.words; }
    // a word's mini-sentence is stored as "I {have} a car."; the braces mark the word
    function sentenceParts(w) {
      const m = /^(.*?)\{([^{}]+)\}(.*)$/.exec(w.sentence || '');
      return m ? { before: m[1], hit: m[2], after: m[3] } : null;
    }
    function sentenceHtml(w, blank) {
      const p = sentenceParts(w);
      if (!p) return esc(w.word);
      return esc(p.before) + (blank ? '<span class="blank">&nbsp;</span>' : '<mark>' + esc(p.hit) + '</mark>') + esc(p.after);
    }
    function plainSentence(w) { return (w.sentence || '').replace(/[{}]/g, ''); }
    function shuffled(a) {
      const r = a.slice();
      for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
      return r;
    }
    function topState(n) {
      if (!topUnlocked(n)) return 'Закрыта';
      const g = T.groups[n] || {};
      const perfect = g.perfect || 0;
      if (perfect >= TOP_NEED) return 'Пройдена';
      if (g.best != null) return 'Без ошибок ' + perfect + ' из ' + TOP_NEED;
      return g.studied ? 'Изучено, теста нет' : 'Не начата';
    }

        if (e instanceof AuthError) return;
        body.innerHTML = '<div id="wordsFrame"></div>';
        errorState('wordsFrame', 'слова', 'reload-words');

    }

    function topSaveProgress(payload) {
      const g = T.groups[payload.group] || (T.groups[payload.group] = {});
      if (payload.studied) g.studied = true;
      if (payload.score != null) {
        g.last = payload.score; g.best = Math.max(g.best || 0, payload.score); g.attempts = (g.attempts || 0) + 1;
        if (payload.score === 100) g.perfect = (g.perfect || 0) + 1;
      }
      api('/api/top-words/progress', { method: 'POST', body: payload }).catch(() => {});
    }

    function renderTop() {
      const body = $('wordsBody');
      if (!T.words) { loadTop(); return; }
      $('view-words').classList.toggle('words-focus', T.screen === 'study' || T.screen === 'quiz');
      if (T.screen === 'study') return renderTopStudy(body);
      if (T.screen === 'quiz') return renderTopQuiz(body);
      if (T.screen === 'result') return renderTopResult(body);
      if (T.screen === 'group') return renderTopGroup(body);
      const count = Math.ceil(T.words.length / TOP_SIZE);
      let passed = 0, rows = '';
      for (let n = 1; n <= count; n++) {
        const g = T.groups[n] || {};
        if ((g.perfect || 0) >= TOP_NEED) passed++;
        const first = (n - 1) * TOP_SIZE + 1;
        const open = topUnlocked(n);
        rows += '<li class="card-item"><button type="button" class="row" data-action="' + (open ? 'top-group' : 'top-locked') + '" data-id="' + n + '"' + (open ? '' : ' aria-disabled="true" style="opacity:.55"') + '>' +
          '<span class="kind k-word k-num">' + n + '</span>' +
          '<span class="row-main"><span class="row-title">Группа ' + n + '</span>' +
          '<span class="row-meta">Слова ' + first + '–' + Math.min(n * TOP_SIZE, T.words.length) + '</span></span>' +
          '<span class="row-end"><span class="row-meta">' + esc(topState(n)) + '</span></span></button></li>';
      }
      body.innerHTML =
        '<div class="top-stack">' +
          '<div class="top-head"><p>Пройдено групп: ' + passed + ' из ' + count + '. Следующая группа открывается, когда предыдущая решена ' + TOP_NEED + ' раза без ошибок.</p>' +
            '<div class="top-bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + count + '" aria-valuenow="' + passed + '"><span style="width:' + Math.round(passed / count * 100) + '%"></span></div></div>' +
          '<button type="button" class="btn primary" data-action="top-test" data-id="0">Общий тест: 20 слов из всех ' + T.words.length + '</button>' +
          (T.groups[0] && T.groups[0].best != null ? '<p class="hint">Общий тест: лучший ' + T.groups[0].best + '%, последний ' + T.groups[0].last + '%, попыток ' + T.groups[0].attempts + '</p>' : '') +
          '<ul class="cards">' + rows + '</ul>' +
        '</div>';
    }

    function renderTopGroup(body) {
      const n = T.group;
      const list = topWordsOf(n);
      body.innerHTML =
        '<div class="top-stack">' +
          '<button type="button" class="btn" data-action="top-home">' + icon('left') + 'Все группы</button>' +
          '<div class="top-head"><h2>Группа ' + n + '</h2><p>' + esc(topState(n)) + '. Тест без ошибок ' + TOP_NEED + ' раза откроет следующую группу.</p></div>' +
          '<div class="actions" style="display:flex; gap:8px; flex-wrap:wrap">' +
            '<button type="button" class="btn primary" data-action="top-study" data-id="' + n + '">Учить карточки</button>' +
            '<button type="button" class="btn" data-action="top-test" data-id="' + n + '">Пройти тест</button>' +
          '</div>' +
          '<ul class="cards">' + list.map(w =>
            '<li class="card-item"><div class="row"><span class="row-main"><span class="row-title" lang="en">' + esc(w.word) + '</span>' +
            '<span class="row-meta">' + esc([w.translation, w.phonetic].filter(Boolean).join(', ')) + '</span>' +
            (sentenceParts(w) ? '<span class="row-meta" lang="en">' + esc(plainSentence(w)) + '</span>' : '') + '</span></div></li>').join('') + '</ul>' +
        '</div>';
    }

    function renderTopStudy(body) {
      const list = topWordsOf(T.group);
      const w = list[T.idx];
      const last = T.idx === list.length - 1;
      body.innerHTML =
        '<div class="top-stack">' +
          '<button type="button" class="btn" data-action="top-group" data-id="' + T.group + '">' + icon('left') + 'Группа ' + T.group + '</button>' +
          '<div class="card">' +
            (sentenceParts(w)
              ? '<p class="card-sent" lang="en">' + sentenceHtml(w) + '</p>' +
                '<p class="card-phon" lang="en">' + esc(w.word) + (w.phonetic ? ' ' + esc(w.phonetic) : '') + '</p>'
              : '<p class="card-word" lang="en">' + esc(w.word) + '</p>' +
                (w.phonetic ? '<p class="card-phon">' + esc(w.phonetic) + '</p>' : '')) +
            (T.flipped
              ? '<div class="card-back">' + (sentenceParts(w) ? '<p class="card-sent-ru">' + esc(w.sentence_ru) + '</p>' : '') +
                '<p class="card-trans">' + (sentenceParts(w) ? '<span lang="en">' + esc(w.word) + '</span> — ' : '') + esc(w.translation) + '</p></div>'
              : '<button type="button" class="btn primary" data-action="top-flip" style="margin-top:16px">Показать перевод</button>') +
          '</div>' +
          '<div class="card-nav">' +
            '<button type="button" class="btn" data-action="top-prev"' + (T.idx === 0 ? ' disabled' : '') + '>' + icon('left') + 'Назад</button>' +
            '<span class="card-count">' + (T.idx + 1) + ' из ' + list.length + '</span>' +
            '<button type="button" class="btn' + (last ? ' primary' : '') + '" data-action="top-next">' + (last ? 'Готово' : 'Дальше' + icon('right')) + '</button>' +
          '</div>' +
        '</div>';
    }

    function topNextCard() {
      const list = topWordsOf(T.group);
      haptic('light');
      if (T.idx < list.length - 1) { T.idx++; T.flipped = false; renderTop(); return; }
      topSaveProgress({ group: T.group, studied: true });
      toast('Группа ' + T.group + ' изучена. Теперь тест');
      T.screen = 'group';
      renderTop();
    }

    // group 0 = the general test: 20 random words from all of them
    function topStartTest(group) {
      if (group && !topUnlocked(group)) return;
      const pool = group ? topWordsOf(group) : shuffled(T.words).slice(0, TOP_SIZE);
      const withSentence = T.words.filter(x => sentenceParts(x));
      // questions alternate: "what does the word mean here" and "fill in the missing word" (the latter only for words with a sentence)
      const qs = shuffled(pool).map((w, i) => {
        const p = sentenceParts(w);
        if (p && i % 2 === 1) {
          const atStart = !p.before.trim();
          const fit = s => s === 'I' ? s : (atStart ? s.charAt(0).toUpperCase() + s.slice(1) : s.toLowerCase());
          // one wrong option comes from words of a similar rank (often the same kind: "it" next to "he"), two are random: not trivial, and rarely a second right answer
          const others = withSentence.filter(x => x.word.toLowerCase() !== w.word.toLowerCase());
          const near = shuffled(others.filter(x => Math.abs(x.id - w.id) <= 30)).slice(0, 1);
          const far = shuffled(others.filter(x => !near.includes(x))).slice(0, 3 - near.length);
          const wrongWords = near.concat(far).map(x => fit(x.word));
          return { w, type: 'cloze', options: shuffled([p.hit].concat(wrongWords)), answer: p.hit, picked: null };
        }
        const wrong = shuffled(T.words.filter(x => x.id !== w.id && x.translation !== w.translation)).slice(0, 3);
        return { w, type: 'meaning', options: shuffled([w].concat(wrong)).map(x => x.translation), answer: w.translation, picked: null };
      });
      T.quiz = { group, qs, i: 0 };
      T.screen = 'quiz';
      haptic('light');
      renderTop();
    }

    function renderTopQuiz(body) {
      const q = T.quiz;
      const cur = q.qs[q.i];
      const answered = cur.picked != null;
      const opts = cur.options.map((o, k) => {
        let cls = 'btn';
        if (answered && o === cur.answer) cls += ' is-right';
        else if (answered && k === cur.picked) cls += ' is-wrong';
        return '<button type="button" class="' + cls + '" data-action="top-answer" data-id="' + k + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('');
      body.innerHTML =
        '<div class="top-stack">' +
          '<div class="top-head"><div class="quiz-bar"><button type="button" class="btn" data-action="top-quit">' + icon('left') + 'Выйти</button>' +
            '<p>' + (q.group ? 'Группа ' + q.group : 'Общий тест') + ' · вопрос ' + (q.i + 1) + ' из ' + q.qs.length + '</p></div>' +
            '<div class="top-bar"><span style="width:' + Math.round(q.i / q.qs.length * 100) + '%"></span></div></div>' +
          (cur.type === 'cloze'
            ? '<p class="quiz-ask">Вставьте пропущенное слово</p>' +
              '<div class="card quiz-card"><p class="card-sent-ru">' + esc(cur.w.sentence_ru) + '</p>' +
                '<p class="card-sent" lang="en">' + sentenceHtml(cur.w, !answered) + '</p></div>'
            : sentenceParts(cur.w)
              ? '<p class="quiz-ask">Что значит <b lang="en">' + esc(cur.w.word) + '</b> в этом предложении?</p>' +
                '<div class="card quiz-card"><p class="card-sent" lang="en">' + sentenceHtml(cur.w) + '</p>' +
                  '<p class="card-sent-ru' + (answered ? '' : ' is-hidden') + '">' + esc(cur.w.sentence_ru) + '</p></div>'
              : '<div class="card quiz-card"><p class="card-word" lang="en">' + esc(cur.w.word) + '</p>' +
                (cur.w.phonetic ? '<p class="card-phon">' + esc(cur.w.phonetic) + '</p>' : '') + '</div>') +
          '<div class="quiz-opts">' + opts + '</div>' +
          (answered ? '<button type="button" class="btn primary quiz-next" data-action="top-after">' + (q.i === q.qs.length - 1 ? 'Показать результат' : 'Дальше') + '</button>' : '') +
        '</div>';
    }

    function topAnswer(k) {
      const cur = T.quiz.qs[T.quiz.i];
      if (cur.picked != null) return;
      cur.picked = k;
      haptic(cur.options[k] === cur.answer ? 'success' : 'warning');
      renderTop();
    }

    function topAfterAnswer() {
      const q = T.quiz;
      if (q.i < q.qs.length - 1) { q.i++; renderTop(); return; }
      const right = q.qs.filter(x => x.options[x.picked] === x.answer).length;
      q.right = right;
      q.score = Math.round(right / q.qs.length * 100);
      topSaveProgress({ group: q.group, score: q.score });
      T.screen = 'result';
      renderTop();
    }

    function renderTopResult(body) {
      const q = T.quiz;
      const wrong = q.qs.filter(x => x.options[x.picked] !== x.answer);
      const perfect = q.group ? ((T.groups[q.group] || {}).perfect || 0) : 0;
      let note;
      if (!q.group) note = q.score + '%.';
      else if (q.score === 100) note = perfect >= TOP_NEED
        ? 'Без ошибок! ' + (q.group < T.words.length / TOP_SIZE ? 'Группа ' + (q.group + 1) + ' открыта.' : 'Это последняя группа.')
        : 'Без ошибок! Засчитано ' + perfect + ' из ' + TOP_NEED + '. Ещё ' + (TOP_NEED - perfect) + ' — и откроется следующая группа.';
      else note = q.score + '%. Есть ошибки, этот раз не засчитан. Нужны ' + TOP_NEED + ' прохождения без ошибок (сейчас ' + perfect + ').';
      body.innerHTML =
        '<div class="top-stack">' +
          '<div class="top-head"><p>' + (q.group ? 'Группа ' + q.group : 'Общий тест') + '</p>' +
            '<p class="top-score">' + q.right + ' из ' + q.qs.length + '</p>' +
            '<p>' + esc(note) + '</p></div>' +
          (wrong.length
            ? '<div><h3 style="margin:0 0 8px">Ошибки</h3><ul class="cards">' + wrong.map(x =>
                '<li class="card-item"><div class="row"><span class="row-main"><span class="row-title" lang="en">' + esc(x.w.word) + '</span>' +
                '<span class="row-meta">' + esc(x.w.translation) + '</span>' +
                (sentenceParts(x.w) ? '<span class="row-meta" lang="en">' + esc(plainSentence(x.w)) + '</span><span class="row-meta">' + esc(x.w.sentence_ru) + '</span>' : '') +
                '</span></div></li>').join('') + '</ul></div>'
            : '<p class="hint">Без ошибок.</p>') +
          '<div class="actions" style="display:flex; gap:8px; flex-wrap:wrap">' +
            '<button type="button" class="btn primary" data-action="top-test" data-id="' + q.group + '">Пройти ещё раз</button>' +
            (q.group ? '<button type="button" class="btn" data-action="top-study" data-id="' + q.group + '">Учить карточки</button>' : '') +
            '<button type="button" class="btn" data-action="top-home">Все группы</button>' +
          '</div>' +
        '</div>';
    }

    // ================= Debts (expenses marked "это долг"; opened from Settings) =================
    let debtsOwe = false;   // false = "Кто мне должен", true = "Кому я должен"
    async function debtsSheet(owe) {
      if (typeof owe === 'boolean') debtsOwe = owe;
      owe = debtsOwe;
      openSheet({ title: owe ? 'Кому я должен' : 'Кто мне должен', kind: 'debts', body: '<div class="skeleton" aria-hidden="true"><div></div><div></div></div>', noFooter: true });
      let data;
      try {
        data = await api('/api/debts?currency=' + S.currency + (owe ? '&dir=owe' : ''));
      } catch (e) {
        if (e instanceof AuthError) return;
        const b = $('sheet').querySelector('.sheet-body');
        if (b) b.innerHTML = stateHtml('Не удалось загрузить долги', 'Проверьте соединение и попробуйте снова.',
          '<button type="button" class="btn primary" data-action="' + (owe ? 'debts-owe' : 'debts') + '">Повторить загрузку</button>');
        return;
      }
      const body = $('sheet').querySelector('.sheet-body');
      if (!body || !sheetCfg || sheetCfg.kind !== 'debts') return;
      const items = data.items || [];
      S.debts = {};
      items.forEach(d => { S.debts[d.id] = d; });
      remember('finance', items);
      const open = items.filter(d => d.debt_left > 0.005);
      const closed = items.filter(d => d.debt_left <= 0.005);
      if (!items.length) {
        body.innerHTML = stateHtml('Долгов нет', owe
          ? 'Откройте трату и включите «Это долг» и «Я должен», либо скажите «Я должен Арбузу 100 тысяч». Долги соберутся здесь.'
          : 'Откройте трату и включите «Это долг», либо скажите «Арбуз должен мне 100 тысяч». Долги соберутся здесь.', '');
        return;
      }
      const row = (d) => {
        const ts = parseTs(d.created_at);
        const done = d.debt_left <= 0.005;
        const partial = !done && Number(d.debt_paid) > 0 ? 'из ' + money(d.original_amount, d.original_currency) : '';
        return '<li class="card-item"><button type="button" class="row" data-action="open-debt" data-id="' + d.id + '">' +
          '<span class="kind k-money">' + icon('wallet') + '</span>' +
          '<span class="row-main"><span class="row-title">' + esc(d.title) + '</span>' +
          '<span class="row-meta">' + esc((done ? (owe ? 'Вернули долг' : 'Вернули всё') : (owe ? 'Вы должны' : 'Должен вам')) + (ts ? ' · ' + dayName(localKey(ts)) : '')) + '</span></span>' +
          '<span class="row-end"><span class="row-amount">' + esc(money(done ? d.original_amount : d.debt_left, d.original_currency)) + '</span>' +
          (partial ? '<span class="row-meta">' + esc(partial) + '</span>' : '') + '</span></button></li>';
      };
      body.innerHTML =
        '<section class="hero" style="padding-top:0"><h3 class="hero-label">' + (owe ? 'Вы должны' : 'Вам должны') + '</h3><p class="hero-amount">' + esc(money(data.total, data.currency)) + '</p></section>' +
        (open.length ? '<ul class="cards">' + open.map(row).join('') + '</ul>' : '<p class="hint">Все долги возвращены.</p>') +
        (closed.length ? '<h3 style="margin:20px 0 8px">Возвращённые</h3><ul class="cards">' + closed.map(row).join('') + '</ul>' : '');
    }

    function debtPaySheet(d) {
      const done = d.debt_left <= 0.005;
      openSheet({
        title: 'Долг: ' + d.title,
        kind: 'debt-pay',
        noFooter: true,
        body:
          '<div class="settings-group"><h3>' + (done ? 'Долг возвращён' : 'Осталось ' + esc(money(d.debt_left, d.original_currency))) + '</h3>' +
            '<p class="hint">' + (d.debt_owe ? 'Занято ' : 'Одолжено ') + esc(money(d.original_amount, d.original_currency)) +
              (Number(d.debt_paid) > 0 ? ', ' + (d.debt_owe ? 'вы вернули ' : 'вернули ') + esc(money(d.debt_paid, d.original_currency)) : '') + '.</p>' +
            (done ? '' :
              '<div class="field"><label for="dPay">' + (d.debt_owe ? 'Вернул часть' : 'Вернули часть') + '</label><input id="dPay" type="text" inputmode="decimal" autocomplete="off"><p class="hint">Сколько ' + (d.debt_owe ? 'вернул' : 'вернули') + ' сейчас, например 30000</p></div>' +
              '<div class="actions" style="display:flex; gap:8px; flex-wrap:wrap">' +
                '<button type="button" class="btn primary" data-action="debt-pay" data-id="' + d.id + '">Записать возврат</button>' +
                '<button type="button" class="btn" data-action="debt-pay-all" data-id="' + d.id + '">' + (d.debt_owe ? 'Вернул всё' : 'Вернули всё') + '</button>' +
              '</div>') +
          '</div>' +
          '<button type="button" class="btn" data-action="open" data-kind="finance" data-id="' + d.id + '">Открыть трату</button>'
      });
    }

    async function payDebtAction(id, all) {
      const d = S.debts && S.debts[id];
      if (!d) return;
      const amount = parseFloat(String(all ? '' : ($('dPay').value || '')).replace(/\s/g, '').replace(',', '.'));
      if (!all && !(amount > 0)) { $('dPay').focus(); toast('Введите, сколько вернули'); return; }
      try {
        const r = await api('/api/debts/' + id + '/pay', { method: 'POST', body: all ? { all: true } : { amount } });
        haptic('success');
        toast(r.left > 0 ? 'Записано. Осталось ' + money(r.left, d.original_currency) : 'Долг закрыт');
        setTimeout(debtsSheet, 220);
        refresh();
      } catch (e) {
        if (!(e instanceof AuthError)) failToast('записать возврат', () => payDebtAction(id, all));
      }
    }

// ================= Settings: daily limit, word reminders =================
    const VOCAB_MODES = { off: 'Не присылать', daily: 'Раз в день', twice: 'Два раза в день', often: 'Каждые 3 часа' };
    const CURRENCY_SIGNS = { VND: '₫', USD: '$', RUB: '₽', AED: 'AED', KZT: '₸', UAH: '₴', EUR: '€' };
    const CURRENCY_NAMES = { RUB: 'Рубли, ₽', VND: 'Донги, ₫', USD: 'Доллары, $', KZT: 'Тенге, ₸', UAH: 'Гривны, ₴', EUR: 'Евро, €', AED: 'Дирхамы, AED' };

    // First run: the person picks the currency and the time zone from lists (nothing is detected from the phone)
    async function loadProfile() {
      try {
        const s = await api('/api/settings?currency=' + S.currency);
        S.profile = s;
        if (Number.isFinite(s.tz_offset_min)) TZ_OFFSET_MS = s.tz_offset_min * 60000;
        if (!s.setup_done && s.default_currency) { S.currency = s.default_currency; $('currencySel').value = S.currency; }
      } catch (e) {}
    }
    function offsetLabel(min) {
      const a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
      return 'UTC' + (min < 0 ? '−' : '+') + h + (m ? ':' + String(m).padStart(2, '0') : '');
    }
    function firstRunSheet(s) {
      const cur = (s.default_currency || 'RUB'), tz = s.timezone || 'Europe/Moscow';
      openSheet({
        title: 'Добро пожаловать', kind: 'first-run', primary: 'Продолжить',
        body:
          '<p class="hint" style="margin:0 0 var(--s4)">Два вопроса, чтобы траты считались в вашей валюте, а день менялся в полночь по вашему времени. Позже это не изменить без обращения в поддержку.</p>' +
          '<div class="field"><label for="frCur">Валюта</label><select id="frCur" name="currency">' +
            (s.supported_currencies || []).map(c => '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(CURRENCY_NAMES[c] || c) + '</option>').join('') +
          '</select></div>' +
          '<div class="field"><label for="frTz">Ваш город</label><select id="frTz" name="tz">' +
            (s.timezones || []).map(t => '<option value="' + esc(t.id) + '"' + (t.id === tz ? ' selected' : '') + '>' + esc(t.label + ', ' + offsetLabel(t.offset_min)) + '</option>').join('') +
          '</select></div>',
        onSave: async (f) => {
          const r = await api('/api/settings', { method: 'PUT', body: { default_currency: f.currency.value, timezone: f.tz.value, setup_done: true } });
          S.profile = r;
          if (Number.isFinite(r.tz_offset_min)) TZ_OFFSET_MS = r.tz_offset_min * 60000;
          S.currency = f.currency.value; $('currencySel').value = S.currency; savePrefs();
          toast('Готово');
          refresh();
        }
      });
    }

    function subDate(iso) {
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }
    // The "Подписка" group at the top of Settings. The owner has no limits, so the card is not shown to them.
    function subscriptionCard(sub) {
      if (!sub || sub.state === 'owner') return '';
      const st = sub.state, until = sub.sub_until ? subDate(sub.sub_until) : '';
      const live = st === 'trial' || st === 'active';
      const title = { trial: 'Пробный период', active: 'Подписка', expired: 'Подписка закончилась', new: 'Нет подписки' }[st] || 'Подписка';
      let html = '<div class="settings-group sub-card"><h3>Подписка</h3>' +

          '<div class="top-bar" role="img" aria-label="Использовано ' + pct + '% дневного лимита"><span style="width:' + pct + '%"></span></div>';

        html += '<p class="hint">Поддержка: <a href="https://t.me/' + esc(nick) + '">' + esc(sub.support) + '</a></p>';
